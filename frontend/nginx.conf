server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 4m;

    # Static SPA assets
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Full-browser mode: a long-lived WebSocket streaming screenshots /
    # forwarding input. Needs the Upgrade/Connection headers and a much
    # longer read timeout than plain API calls (an idle tab shouldn't get
    # disconnected just because the user stopped moving the mouse).
    location /api/browser/full/ws {
        proxy_pass http://backend:8000/api/browser/full/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;

        proxy_cookie_path / /;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Backend API - only reachable from this container over the internal
    # Docker network. The external TLS-terminating reverse proxy already
    # set X-Forwarded-For/X-Real-IP/X-Forwarded-Proto; we forward them
    # unchanged and append ourselves as the next hop.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;

        proxy_cookie_path / /;
        proxy_read_timeout 60s;
    }
}

# Docker's embedded DNS (127.0.0.11). A plain `proxy_pass http://backend:8000`
# below would resolve "backend" to an IP ONCE when nginx's worker starts and
# cache it for the worker's whole lifetime - if the backend container is ever
# recreated (a rebuild, a crash-restart, the self-update feature) it gets a
# new IP, and nginx keeps silently hammering the old, now-dead one
# ("connect() failed: Connection refused") until nginx itself restarts. Using
# a variable in proxy_pass forces nginx to re-resolve on this short TTL
# instead.
#
# IMPORTANT nginx gotcha: once proxy_pass uses a variable, nginx can no
# longer do its usual "replace the matched location prefix with the
# proxy_pass URI" rewrite - a proxy_pass value that includes a path (e.g.
# `http://$backend/api/;`) then means EXACTLY that literal path is sent
# upstream for every request, dropping the rest of the original URI
# entirely (confirmed: this silently 404'd every request). The fix is to
# give proxy_pass no path at all when it uses a variable - nginx then
# forwards the full, unmodified original request URI as-is.
resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 4m;

    set $backend backend:8000;
    # Only actually running when the opt-in "dockerctl" profile is enabled
    # (see docker-compose.yml/docker-compose.dockerctl.yml) - using a
    # variable here defers DNS resolution to request time (same trick as
    # $backend above, see the file header), so nginx doesn't fail to start
    # just because "terminal" isn't resolvable when the feature is off.
    set $terminal terminal:7681;

    # Static SPA assets
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Full-browser mode: a long-lived WebSocket streaming screenshots /
    # forwarding input. Needs the Upgrade/Connection headers and a much
    # longer read timeout than plain API calls (an idle tab shouldn't get
    # disconnected just because the user stopped moving the mouse).
    location /api/browser/full/ws {
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;

        proxy_cookie_path / /;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Terminal app (opt-in, see docker-compose.dockerctl.yml): unlike every
    # other internal-only service in this stack, ttyd needs full JS/WS
    # support for a real terminal - it can't go through the text-mode
    # proxy's script-stripping the way SnappyMail does. So instead every
    # request (including the WebSocket upgrade) is gated behind the same
    # admin+LAN check every other sensitive endpoint uses
    # (backend/app/routers/terminal.py), via an auth_request sub-request,
    # then proxied straight through to the ttyd container.
    location = /internal/terminal-authcheck {
        internal;
        proxy_pass http://$backend/api/terminal/authcheck;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cookie_path / /;
    }

    location /api/terminal/ {
        auth_request /internal/terminal-authcheck;

        # No rewrite: ttyd is launched with --base-path /api/terminal (see
        # terminal/Dockerfile), so it expects and emits URLs that already
        # include this prefix - stripping it here would break its own
        # asset/WebSocket URLs.
        proxy_pass http://$terminal;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Backend API - only reachable from this container over the internal
    # Docker network. The external TLS-terminating reverse proxy already
    # set X-Forwarded-For/X-Real-IP/X-Forwarded-Proto; we forward them
    # unchanged and append ourselves as the next hop.
    location /api/ {
        proxy_pass http://$backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;

        proxy_cookie_path / /;
        proxy_read_timeout 60s;
    }
}

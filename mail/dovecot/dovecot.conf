# Minimal Dovecot config: a local IMAP+LMTP backend used only to hold the
# mail fetchmail pulls in from each user's external accounts (see
# ../fetchmail and app/mail_config.py). Never reachable outside the
# "internal" Docker network - Roundcube is the only thing that talks IMAP
# to it, fetchmail the only thing that talks LMTP to it.
protocols = imap lmtp sieve
listen = *
disable_plaintext_auth = no
auth_mechanisms = plain login
ssl = no

mail_location = maildir:/var/mail/%u

passdb {
  driver = passwd-file
  # Written by the backend (see app/mail_config.py) into the shared
  # "mail-config" volume, mounted read-only here.
  args = scheme=SHA512-CRYPT username_format=%u /etc/dovecot/shared/dovecot-users
}

userdb {
  driver = static
  args = uid=vmail gid=vmail home=/var/mail/%u
}

# fetchmail delivers plus-addressed mail (alice+Gmail@local) and
# global.sieve below files it into the "Gmail" folder automatically -
# this is how each external account ends up in its own folder.
recipient_delimiter = +

service lmtp {
  inet_listener lmtp {
    address = *
    port = 24
  }
}

plugin {
  sieve = /var/mail/%u/.sieve
  sieve_before = /etc/dovecot/global.sieve
}

protocol lda {
  mail_plugins = $mail_plugins sieve
}

protocol lmtp {
  mail_plugins = $mail_plugins sieve
}

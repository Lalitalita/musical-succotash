# Opt-in override that powers the "Docker" and "Terminal" desktop apps -
# a point-and-click container list (start/stop/restart/logs/stats) and a
# real interactive shell with `docker`/`docker exec` access.
#
# WARNING: mounting the Docker socket gives root-equivalent control of this
# HOST, not just these containers - anyone who can reach these apps
# (admin account + LAN/VPN, same gate as the rest of this app's sensitive
# features) can start/stop/inspect any container, read/write anything the
# Docker daemon can, and from the Terminal app run arbitrary commands
# against the whole host. Only use this if you understand and accept that
# trade-off. Without this file, "Docker" reports itself unavailable and
# "Terminal" is just an empty, useless shell.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dockerctl.yml \
#     --profile dockerctl up -d --build
#
# Combine with docker-compose.selfupdate.yml the same way (both mount the
# same socket - harmless to specify twice) if you want self-update too:
#   docker compose -f docker-compose.yml -f docker-compose.selfupdate.yml \
#     -f docker-compose.dockerctl.yml --profile dockerctl up -d --build
services:
  backend:
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
  terminal:
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

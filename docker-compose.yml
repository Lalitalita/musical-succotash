networks:
  public:
    driver: bridge
  # frontend <-> backend. NOT marked internal:true: the backend needs
  # outbound internet access for the text-mode browser proxy (DNS + HTTP to
  # the sites the user asks it to fetch). Isolation from the host is
  # achieved by simply never publishing a port for the backend, not by
  # cutting off egress.
  internal:
    driver: bridge
  # backend <-> postgres/redis only. These never need to reach the
  # internet, so this network stays fully internal (no gateway at all).
  data:
    driver: bridge
    internal: true

volumes:
  postgres-data:
  redis-data:
  backend-uploads:
  backend-userfiles:
  roundcube-data:

services:
  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks:
      - public
      - internal
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    networks:
      - internal
      - data
    environment:
      APP_NAME: ${APP_NAME:-WebDesktop}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SECRET_KEY: ${SECRET_KEY}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-720}
      MFA_PENDING_TTL_MINUTES: ${MFA_PENDING_TTL_MINUTES:-5}

      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-webdesktop}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-webdesktop}
      REDIS_URL: redis://redis:6379/0

      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-2}
      ADMIN_IP_WHITELIST: ${ADMIN_IP_WHITELIST:-}
      INTERNAL_PROXY_ALLOWLIST: ${INTERNAL_PROXY_ALLOWLIST:-roundcube}

      LOGIN_MAX_ATTEMPTS_PER_WINDOW: ${LOGIN_MAX_ATTEMPTS_PER_WINDOW:-5}
      LOGIN_WINDOW_SECONDS: ${LOGIN_WINDOW_SECONDS:-300}
      LOCKOUT_BASE_SECONDS: ${LOCKOUT_BASE_SECONDS:-30}
      LOCKOUT_MAX_SECONDS: ${LOCKOUT_MAX_SECONDS:-3600}
      MFA_ALERT_FAILURE_THRESHOLD: ${MFA_ALERT_FAILURE_THRESHOLD:-3}

      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_FROM: ${SMTP_FROM:-alerts@webdesktop.local}
      SMTP_ALERT_TO: ${SMTP_ALERT_TO:-}

      GEOIP_DB_PATH: /app/geoip/GeoLite2-City.mmdb

      BROWSER_PROXY_TIMEOUT_SECONDS: ${BROWSER_PROXY_TIMEOUT_SECONDS:-12}
      BROWSER_PROXY_MAX_BYTES: ${BROWSER_PROXY_MAX_BYTES:-3145728}
      BROWSER_PROXY_MAX_STREAM_BYTES: ${BROWSER_PROXY_MAX_STREAM_BYTES:-1073741824}

      FULL_BROWSER_ENABLED: ${FULL_BROWSER_ENABLED:-true}
      FULL_BROWSER_MAX_SESSIONS: ${FULL_BROWSER_MAX_SESSIONS:-3}
      FULL_BROWSER_IDLE_TIMEOUT_SECONDS: ${FULL_BROWSER_IDLE_TIMEOUT_SECONDS:-300}
      FULL_BROWSER_MAX_LIFETIME_SECONDS: ${FULL_BROWSER_MAX_LIFETIME_SECONDS:-3600}
      FULL_BROWSER_FRAME_INTERVAL_MS: ${FULL_BROWSER_FRAME_INTERVAL_MS:-350}
      FULL_BROWSER_IDLE_FRAME_INTERVAL_MS: ${FULL_BROWSER_IDLE_FRAME_INTERVAL_MS:-2000}
      FULL_BROWSER_ACTIVE_WINDOW_SECONDS: ${FULL_BROWSER_ACTIVE_WINDOW_SECONDS:-2.0}

      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@webdesktop.local}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      RESET_ADMIN_PASSWORD: ${RESET_ADMIN_PASSWORD:-false}

      LOCAL_FILES_ROOT: /app/userfiles
      SMB_HOST: ${SMB_HOST:-}
      SMB_PORT: ${SMB_PORT:-445}
      SMB_SHARE: ${SMB_SHARE:-}
      SMB_USERNAME: ${SMB_USERNAME:-}
      SMB_PASSWORD: ${SMB_PASSWORD:-}
      SMB_DOMAIN: ${SMB_DOMAIN:-}
    volumes:
      - ./backend/geoip:/app/geoip:ro
      - backend-uploads:/app/uploads
      - backend-userfiles:/app/userfiles
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks:
      - data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-webdesktop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-webdesktop}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-webdesktop}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - data
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Self-hosted webmail. Opt-in: this service only starts with
  # `docker compose --profile roundcube up -d --build`, never on a plain
  # `docker compose up -d --build` - so leaving the ROUNDCUBE_* vars empty
  # in .env is fine and requires no extra action. Never exposed publicly or
  # even to the host: only reachable by "backend" over the "internal"
  # network, and only through the browser proxy's INTERNAL_PROXY_ALLOWLIST
  # ("roundcube" by default - see backend/app/browser_ssrf.py). It needs its
  # own outbound internet access to reach your real IMAP/SMTP server, hence
  # "internal" and not "data". Point Paramètres → Applications → "URL du
  # webmail" at http://roundcube once IMAP_HOST/SMTP_HOST below are set.
  roundcube:
    image: roundcube/roundcubemail:latest
    profiles: ["roundcube"]
    restart: unless-stopped
    networks:
      - internal
    environment:
      ROUNDCUBEMAIL_DB_TYPE: sqlite
      ROUNDCUBEMAIL_SKIN: elastic
      ROUNDCUBEMAIL_DEFAULT_HOST: ${ROUNDCUBE_IMAP_HOST:-}
      ROUNDCUBEMAIL_DEFAULT_PORT: ${ROUNDCUBE_IMAP_PORT:-993}
      ROUNDCUBEMAIL_SMTP_SERVER: ${ROUNDCUBE_SMTP_HOST:-}
      ROUNDCUBEMAIL_SMTP_PORT: ${ROUNDCUBE_SMTP_PORT:-587}
      # Must be exactly 24 characters - generate with: openssl rand -hex 12
      ROUNDCUBEMAIL_DES_KEY: ${ROUNDCUBE_DES_KEY:-}
    volumes:
      - roundcube-data:/var/roundcube/db
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

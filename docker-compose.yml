networks:
  public:
    driver: bridge
  # frontend <-> backend. NOT marked internal:true: the backend needs
  # outbound internet access for the text-mode browser proxy (DNS + HTTP to
  # the sites the user asks it to fetch). Isolation from the host is
  # achieved by simply never publishing a port for the backend, not by
  # cutting off egress.
  internal:
    driver: bridge
  # backend <-> postgres/redis only. These never need to reach the
  # internet, so this network stays fully internal (no gateway at all).
  data:
    driver: bridge
    internal: true

volumes:
  postgres-data:
  redis-data:
  # Fixed (non project-prefixed) names: the self-update feature's ephemeral
  # helper container references these by exact name over the Docker socket,
  # from outside this compose project's namespacing.
  backend-uploads:
    name: backend-uploads
  backend-userfiles:
    name: backend-userfiles
  backend-browser-state:
    name: backend-browser-state
  backend-backups:
    name: backend-backups
  snappymail-data:

services:
  # A real, plain SOCKS5 proxy: point your OWN browser (any device on the
  # LAN) at it and all its traffic exits through this Debian host - full
  # native browser speed/quality/JS support, nothing server-side rendered
  # or screenshotted. Opt-in (`docker compose --profile proxy up -d --build`)
  # and refuses to start without SOCKS5_USER/SOCKS5_PASSWORD set (never an
  # open relay). See README for how to configure a browser to use it.
  socks5-proxy:
    build:
      context: ./proxy
    profiles: ["proxy"]
    restart: unless-stopped
    networks:
      - internal
    ports:
      - "${SOCKS5_PORT:-1080}:1080"
    environment:
      # Required, but NOT enforced with compose's ${VAR:?} here - that
      # interpolates (and errors) for every service in the file whether or
      # not its profile is active, which would break a plain default
      # `docker compose up -d --build` for anyone who never touches this
      # profile at all. Enforced instead in entrypoint.sh, at container
      # start, which only ever runs when this profile is actually used.
      SOCKS5_USER: ${SOCKS5_USER:-}
      SOCKS5_PASSWORD: ${SOCKS5_PASSWORD:-}

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks:
      - public
      - internal
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    networks:
      - internal
      - data
    environment:
      APP_NAME: ${APP_NAME:-WebDesktop}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SECRET_KEY: ${SECRET_KEY}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-720}
      MFA_PENDING_TTL_MINUTES: ${MFA_PENDING_TTL_MINUTES:-5}

      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-webdesktop}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-webdesktop}
      REDIS_URL: redis://redis:6379/0

      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-2}
      ADMIN_IP_WHITELIST: ${ADMIN_IP_WHITELIST:-}
      INTERNAL_PROXY_ALLOWLIST: ${INTERNAL_PROXY_ALLOWLIST:-snappymail}

      LOGIN_MAX_ATTEMPTS_PER_WINDOW: ${LOGIN_MAX_ATTEMPTS_PER_WINDOW:-5}
      LOGIN_WINDOW_SECONDS: ${LOGIN_WINDOW_SECONDS:-300}
      LOCKOUT_BASE_SECONDS: ${LOCKOUT_BASE_SECONDS:-30}
      LOCKOUT_MAX_SECONDS: ${LOCKOUT_MAX_SECONDS:-3600}
      MFA_ALERT_FAILURE_THRESHOLD: ${MFA_ALERT_FAILURE_THRESHOLD:-3}

      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_FROM: ${SMTP_FROM:-alerts@webdesktop.local}
      SMTP_ALERT_TO: ${SMTP_ALERT_TO:-}

      GEOIP_DB_PATH: /app/geoip/GeoLite2-City.mmdb

      BROWSER_PROXY_TIMEOUT_SECONDS: ${BROWSER_PROXY_TIMEOUT_SECONDS:-12}
      BROWSER_PROXY_MAX_BYTES: ${BROWSER_PROXY_MAX_BYTES:-3145728}
      BROWSER_PROXY_MAX_STREAM_BYTES: ${BROWSER_PROXY_MAX_STREAM_BYTES:-1073741824}

      FULL_BROWSER_ENABLED: ${FULL_BROWSER_ENABLED:-true}
      FULL_BROWSER_MAX_SESSIONS: ${FULL_BROWSER_MAX_SESSIONS:-3}
      FULL_BROWSER_IDLE_TIMEOUT_SECONDS: ${FULL_BROWSER_IDLE_TIMEOUT_SECONDS:-300}
      FULL_BROWSER_MAX_LIFETIME_SECONDS: ${FULL_BROWSER_MAX_LIFETIME_SECONDS:-3600}

      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@webdesktop.local}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      RESET_ADMIN_PASSWORD: ${RESET_ADMIN_PASSWORD:-false}

      LOCAL_FILES_ROOT: /app/userfiles
      SMB_HOST: ${SMB_HOST:-}
      SMB_PORT: ${SMB_PORT:-445}
      SMB_SHARE: ${SMB_SHARE:-}
      SMB_USERNAME: ${SMB_USERNAME:-}
      SMB_PASSWORD: ${SMB_PASSWORD:-}
      SMB_DOMAIN: ${SMB_DOMAIN:-}

      SELF_UPDATE_ENABLED: ${SELF_UPDATE_ENABLED:-false}
      UPDATE_GITHUB_REPO: ${UPDATE_GITHUB_REPO:-}
      UPDATE_GIT_BRANCH: ${UPDATE_GIT_BRANCH:-main}
      HOST_PROJECT_DIR: ${HOST_PROJECT_DIR:-}
    volumes:
      - ./backend/geoip:/app/geoip:ro
      - backend-uploads:/app/uploads
      - backend-userfiles:/app/userfiles
      - backend-browser-state:/app/browser_state
      - backend-backups:/app/backups
      # Powers the "Docker" app (backend/app/routers/docker_manager.py) and
      # the "Terminal" app's `docker exec` access to other containers -
      # gives this container root-equivalent control of the HOST, not just
      # itself (start/stop/inspect any container, read/write anything the
      # Docker daemon can). Deliberate, explicit trade-off made at the
      # user's request so both apps work out of the box with a plain
      # `docker compose up`, protected only by the same admin+LAN gate as
      # every other sensitive endpoint in this app (see README's "Terminal
      # et Docker" section) - there is no separate opt-in flag for it.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks:
      - data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-webdesktop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-webdesktop}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-webdesktop}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - data
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Self-hosted webmail. Opt-in: only starts with
  # `docker compose --profile webmail up -d --build`. Never exposed
  # publicly or even to the host - only reachable by "backend" over the
  # "internal" network, and only through the browser proxy's
  # INTERNAL_PROXY_ALLOWLIST ("snappymail" by default - see
  # backend/app/browser_ssrf.py). SnappyMail (a maintained, actively
  # developed webmail client) supports adding several real IMAP accounts
  # under ONE login natively (Settings > Accounts inside the app once
  # logged in) - each user just logs in with their own first mail account,
  # then adds the rest themselves, no server-side aggregation needed.
  # First-time setup: open http://<host>/?admin (proxied like any other
  # address) - default admin/admin, CHANGE IT IMMEDIATELY - to enable the
  # IMAP/SMTP providers you want available (or "allow any domain").
  snappymail:
    image: djmaze/snappymail:latest
    profiles: ["webmail"]
    restart: unless-stopped
    networks:
      - internal
    volumes:
      - snappymail-data:/var/lib/snappymail
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8888/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # A real interactive shell in the browser (the "Terminal" desktop app),
  # via ttyd (see terminal/Dockerfile), with `docker`/`docker exec` access
  # to every other container on the host - the same root-equivalent
  # trade-off as the docker.sock mount on "backend" above, made
  # deliberately so both apps work with a plain `docker compose up` (see
  # README's "Terminal et Docker" section). Never exposed on the host or
  # the public network - only reachable through the backend's own
  # reverse proxy (backend/app/routers/terminal.py), which gates every
  # request behind the same admin+LAN check as every other sensitive
  # endpoint before ever relaying a byte to it.
  terminal:
    build:
      context: ./terminal
    restart: unless-stopped
    networks:
      - internal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
